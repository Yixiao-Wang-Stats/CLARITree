[build-system]
requires = ["scikit-build-core>=0.11", "pybind11[global]>=2.12", "numpy>=1.22"]
build-backend = "scikit_build_core.build"

[project]
name = "claritree"
version = "0.1.0"
description = "CLARITree: optimal regression trees with C++ backend"
readme = "README.md"
authors = [
    { name = "Yixiao Wang" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22"
]

[project.optional-dependencies]
examples = [
    "pandas>=1.0.0",
    "scikit-learn>=1.2.0"
]

[project.urls]
Homepage = "https://github.com/Yixiao-Wang-Stats/CLARITree"
Repository = "https://github.com/Yixiao-Wang-Stats/CLARITree"
Issues = "https://github.com/Yixiao-Wang-Stats/CLARITree/issues"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["clari_tree"]
sdist.exclude = [
    "data/**",
    "results/**",
    "scripts/**",
    "test/**",
    "PILOT/**",
    "Makefile",
    "rebuild_clari_tree.sh"
]

[tool.scikit-build.cmake]
build-type = "Release"
args = [
    "-DCMAKE_CXX_STANDARD=17"
]
